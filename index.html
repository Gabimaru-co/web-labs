    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;

            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;

        }
        nav a {
            display: inline-block;

            font-size: 1.1rem;
            border-radius: 50px;
            width: 280px;
            transition: all 0.3s;
        }
        nav a:hover {
