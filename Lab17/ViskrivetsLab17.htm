<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViskrivetsLab17</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="text-center text-white mt-4 fw-bold">ЛР №17: Фонові зображення</h1>


<section class="block block1">
    <div class="content">
        <h2>Звичайний фон</h2>
        <p>background-image</p>
    </div>
</section>
<section class="block block2">
    <div class="content">
        <h2>Без повторення</h2>
        <p>background-repeat: no-repeat</p>
    </div>
</section>
<section class="block block3">
    <div class="content">
        <h2>Cover + Center</h2>
        <p>background-size + position</p>
    </div>
</section>
<section class="block block4">
    <div class="content">
        <h2>Parallax</h2>
        <p>background-attachment: fixed</p>
    </div>
</section>
<section class="block block5">
    <div class="content">
        <h2>Градієнт + фон</h2>
        <p>linear-gradient + image</p>
    </div>
</section>
<section class="block block6">
    <div class="content">
        <h2>Multiple Background</h2>
        <p>кілька фонів одночасно</p>
    </div>
</section>
<script src="script.js"></script>

</body>
</html>
