<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background: #3578c0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Реєстрація</h1>
        
        <form action="#" method="POST">
            <label for="username">Ім'я користувача:</label>
            <input type="text" id="username" name="username" placeholder="Введіть логін" required>

            <label for="email">Email адреса:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <label for="confirm_password">Підтвердження пароля:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>

            <label for="full_name">Прізвище та ім'я:</label>
            <input type="text" id="full_name" name="full_name" placeholder="Іванов Іван Іванович" required>

            <button type="submit">Зареєструватися</button>
        </form>
    </div>
</body>
</html>
