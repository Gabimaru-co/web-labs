<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Бібліотека</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Анкета читача</h2>

<form action="result.html">

<input type="text" placeholder="Ім'я">
<input type="text" placeholder="Прізвище">

<input type="password" placeholder="Пароль">

<input type="radio" name="sex"> Ч
<input type="radio" name="sex"> Ж

<input type="checkbox"> Студент
<input type="checkbox"> Робота
<input type="checkbox"> Спорт
<input type="checkbox"> Хобі
<input type="checkbox"> Інше

<input type="radio" name="age"> 10-18
<input type="radio" name="age"> 18-25
<input type="radio" name="age"> 25+
<select multiple>
<option>Фантастика</option>
<option>Детектив</option>
<option>Роман</option>
<option>Наука</option>
<option>Історія</option>
<option>Жахи</option>
<option>Фентезі</option>
<option>Драма</option>
<option>Комедія</option>
<option>Пригоди</option>
</select>

<textarea placeholder="Що читаєте"></textarea>

<div class="buttons">
<input type="submit">
<input type="reset">
</div>

</form>

</body>
</html>
